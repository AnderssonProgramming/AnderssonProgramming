name: Generate profile assets

# Builds the contribution snake and the 3D contribution calendar shown in the
# README, and publishes them to the `output` branch so `main` history stays clean.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF8C00&color_dots=#ebedf0,#fed7aa,#fb923c,#f43f8e,#8b3df0
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8C00&color_dots=#161b22,#5a2a00,#b35a00,#ff3d81,#a855f7

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect assets
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
