<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="t d">
  <title id="t">Gym MVP</title>
  <desc id="d">Tap a muscle on a 3D body model to get exercises, sets, reps and media guides. Built with Next.js, Three Fiber, Tailwind. Main language: TypeScript.</desc>
  <defs>
    <clipPath id="c"><rect width="480" height="240" rx="18"/></clipPath>
    <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#9BE34A" stop-opacity=".24"/><stop offset="1" stop-color="#9BE34A" stop-opacity="0"/></radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BE34A" stop-opacity=".7"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="240" fill="#060B08"/>
    <rect class="glow" width="480" height="240" fill="url(#g)"/>
  </g>
