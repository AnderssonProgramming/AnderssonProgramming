<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="t d">
  <title id="t">Agentic Security Auditor</title>
  <desc id="d">Seven agents scan, triage, patch and validate every pull request, then gate the deploy. Built with LangGraph, Claude, Semgrep, Trivy. Main language: Python.</desc>
  <defs>
    <clipPath id="c"><rect width="480" height="240" rx="18"/></clipPath>
    <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#2FCD50" stop-opacity=".24"/><stop offset="1" stop-color="#2FCD50" stop-opacity="0"/></radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FCD50" stop-opacity=".7"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="240" fill="#060B08"/>
    <rect class="glow" width="480" height="240" fill="url(#g)"/>
  </g>
  <rect x=".75" y=".75" width="478.5" height="238.5" rx="17.25" fill="none" stroke="url(#b)" stroke-width="1.5"/>
  <text x="28" y="44" class="mono" font-size="11.5" fill="#2FCD50" letter-spacing="1.2">AGENTIC AI · DEVSECOPS</text>
  <path d="M438 34 L450 22 M441 22 H450 V31" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="82" class="sans" font-size="23" font-weight="700" fill="#F0F6FC">Agentic Security Auditor</text>
  <text x="28" y="113" class="sans" font-size="15" fill="#8B949E">Seven agents scan, triage, patch and validate</text>
  <text x="28" y="135" class="sans" font-size="15" fill="#8B949E">every pull request, then gate the deploy.</text>
