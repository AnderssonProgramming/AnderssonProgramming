<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Professional profile</title>
  <desc id="d">Custom Software Engineering Associate doing QA support as an intern at Accenture. Systems Engineering student at Escuela Colombiana de Ingeniería Julio Garavito. Teaching and Research Assistant in Database Modeling and Object-Oriented Programming. Focused on collaborative development and innovation.</desc>

  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8C00"/>
      <stop offset=".5" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FF8C00" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="420" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6, 0, .2, 1) .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .item { opacity: 0; animation: in .6s ease-out forwards; }
    .i1 { animation-delay: .3s; } .i2 { animation-delay: .65s; } .i3 { animation-delay: 1s; } .i4 { animation-delay: 1.35s; }
    @keyframes in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .item { animation: none; opacity: 1; }
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="600" height="420" fill="#0D1117"/>
    <rect width="600" height="420" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="599" height="419" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>

  <text x="36" y="46" class="mono" font-size="13" fill="#8B949E">career.log</text>
  <text x="36" y="76" class="sans" font-size="22" font-weight="700" fill="#F0F6FC">Professional Profile</text>

  <!-- rail -->
  <path d="M48 120 V372" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  <path class="draw" pathLength="1" d="M48 120 V372" stroke="url(#rail)" stroke-width="2" stroke-linecap="round"/>

  <!-- 1 · Accenture -->
  <g class="item i1">
    <circle class="pulse" cx="48" cy="120" r="6" fill="#3FB950"/>
    <circle cx="48" cy="120" r="6" fill="#0D1117" stroke="#FF8C00" stroke-width="2.5"/>
    <text x="74" y="114" class="mono" font-size="12.5" fill="#FF8C00" letter-spacing=".8">ACCENTURE</text>
    <rect x="160" y="102" width="44" height="18" rx="9" fill="#3FB950" fill-opacity=".14" stroke="#3FB950" stroke-opacity=".5"/>
    <text x="182" y="115" text-anchor="middle" class="mono" font-size="11" fill="#3FB950">now</text>
    <text x="74" y="139" class="sans" font-size="17" font-weight="600" fill="#E6EDF3">Custom Software Engineering Associate</text>
    <text x="74" y="160" class="sans" font-size="15" fill="#8B949E">QA Support as Accenture intern</text>
  </g>

  <!-- 2 · ECI student -->
  <g class="item i2">
    <circle cx="48" cy="204" r="6" fill="#0D1117" stroke="#FF3D81" stroke-width="2.5"/>
    <text x="74" y="198" class="mono" font-size="12.5" fill="#FF3D81" letter-spacing=".8">ESCUELA COLOMBIANA DE INGENIERÍA</text>
    <text x="74" y="223" class="sans" font-size="17" font-weight="600" fill="#E6EDF3">Systems Engineering Student</text>
    <text x="74" y="244" class="sans" font-size="15" font-style="italic" fill="#8B949E">Escuela Colombiana de Ingeniería Julio Garavito</text>
  </g>

  <!-- 3 · Teaching -->
  <g class="item i3">
    <circle cx="48" cy="288" r="6" fill="#0D1117" stroke="#D44CC0" stroke-width="2.5"/>
    <text x="74" y="282" class="mono" font-size="12.5" fill="#D44CC0" letter-spacing=".8">CLASSROOM &amp; LAB</text>
    <text x="74" y="307" class="sans" font-size="17" font-weight="600" fill="#E6EDF3">Teaching and Research Assistant</text>
    <text x="74" y="328" class="sans" font-size="15" fill="#8B949E">Database Modeling &amp; Object-Oriented Programming</text>
  </g>

  <!-- 4 · Mindset -->
  <g class="item i4">
    <circle cx="48" cy="372" r="6" fill="#A855F7"/>
    <text x="74" y="377" class="sans" font-size="15" fill="#C9D1D9">Collaborative Development &amp; Innovation</text>
  </g>
</svg>
